name: Verify bundle

# The shipped panel bundle must be reproducible from the public source it
# claims to come from. viewer-source.json pins a tag of
# robot-one-software/dashable-viewer; this rebuilds that tag and fails unless
# the result is byte-identical to the committed file. Runs on every push and
# is required by the Release workflow.

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Bundle reproduces from the pinned source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read viewer-source.json
        id: source
        run: |
          {
            echo "repo=$(jq -r .repository viewer-source.json)"
            echo "tag=$(jq -r .tag viewer-source.json)"
            echo "sha256=$(jq -r .sha256 viewer-source.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Check the committed bundle matches viewer-source.json
        run: |
          actual=$(sha256sum custom_components/dashable/frontend/dashable-panel.js | cut -d' ' -f1)
          if [ "$actual" != "${{ steps.source.outputs.sha256 }}" ]; then
            echo "Committed bundle sha256 $actual does not match viewer-source.json" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.source.outputs.repo }}
          ref: ${{ steps.source.outputs.tag }}
          path: viewer-source

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: viewer-source/package-lock.json

      - name: Rebuild the bundle from the pinned source
        working-directory: viewer-source
        run: |
          npm ci
          npm run build

      - name: Check the rebuilt bundle is byte-identical to the committed one
        run: |
          if ! cmp viewer-source/viewer/dist/dashable-panel.js custom_components/dashable/frontend/dashable-panel.js; then
            echo "The bundle rebuilt from ${{ steps.source.outputs.repo }}@${{ steps.source.outputs.tag }} differs from the committed file" >&2
            exit 1
          fi
          echo "dashable-panel.js reproduces from ${{ steps.source.outputs.repo }}@${{ steps.source.outputs.tag }}"
